<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubTX - Subtitle Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div class="header-brand">
        <svg class="header-logo-dot" viewBox="0 0 8 8" width="8" height="8" aria-hidden="true">
          <circle cx="4" cy="4" r="3"/>
        </svg>
        <span class="header-title">SubTX</span>
      </div>
      <div class="header-actions">
        <span id="subtitle-count" class="count-badge hidden">0 found</span>
        <span id="status-text" class="status-text"></span>
        <button id="refresh-btn" class="btn btn-icon" type="button" aria-label="Refresh subtitles" title="Refresh">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 8a7 7 0 0 1 13.17-3.17"/>
            <path d="M15 1v4h-4"/>
            <path d="M15 8a7 7 0 0 1-13.17 3.17"/>
            <path d="M1 15v-4h4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- View: Loading -->
    <div id="view-loading">
      <div class="view-pad">
        <div class="skeleton-card">
          <div class="skeleton skeleton-line w-55"></div>
          <div class="skeleton skeleton-line w-75"></div>
          <div class="skeleton skeleton-line w-40"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-line w-60"></div>
          <div class="skeleton skeleton-line w-65"></div>
          <div class="skeleton skeleton-line w-45"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-line w-50"></div>
          <div class="skeleton skeleton-line w-80"></div>
          <div class="skeleton skeleton-line w-35"></div>
        </div>
      </div>
    </div>

    <!-- View: Empty -->
    <div id="view-empty" class="hidden">
      <div class="view-pad center-content">
        <div class="empty-state">
          <svg class="state-icon" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="12" width="56" height="40" rx="4"/>
            <path d="M18 26a4 4 0 0 1 4-4h2"/>
            <path d="M18 34a4 4 0 0 0 4 4h2"/>
            <path d="M36 26a4 4 0 0 1 4-4h2"/>
            <path d="M36 34a4 4 0 0 0 4 4h2"/>
          </svg>
          <h2 class="state-title">No subtitles found</h2>
          <p class="state-text">Try refreshing the page or navigating to a video with subtitles.</p>
          <button class="btn btn-primary" type="button">Scan Page</button>
        </div>
      </div>
    </div>

    <!-- View: Error -->
    <div id="view-error" class="hidden">
      <div class="view-pad center-content">
        <div class="error-state">
          <svg class="state-icon error-icon-svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="32" cy="32" r="28"/>
            <path d="M32 20v16"/>
            <path d="M32 42v2"/>
          </svg>
          <h2 class="state-title error-title-color">Something went wrong</h2>
          <p id="error-message" class="state-text error-text">An unexpected error occurred while scanning.</p>
          <button class="btn btn-primary" type="button">Retry</button>
        </div>
      </div>
    </div>

    <!-- View: Content -->
    <div id="view-content" class="hidden">
      <div id="subtitle-list">
        <!-- Subtitle cards are injected by popup.js -->
      </div>
    </div>

    <!-- Bottom Controls -->
    <div id="controls" class="hidden">
      <div class="controls-inner">
        <div class="format-group">
          <label for="bulk-format" class="format-label">Format</label>
          <select id="bulk-format">
            <option value="vtt">VTT</option>
            <option value="srt">SRT</option>
            <option value="txt">TXT</option>
          </select>
        </div>
        <button id="bulk-download-btn" class="btn btn-primary" type="button" disabled>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 1v10"/>
            <path d="M4 7l4 4 4-4"/>
            <path d="M1 13v2h14v-2"/>
          </svg>
          <span>Download 0</span>
        </button>
      </div>
    </div>

  </div>
  <script src="subtitle-converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
